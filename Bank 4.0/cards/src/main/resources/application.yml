server:
  port: 8091
spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:bankDetails
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:9090/"
management:
  endpoints:
    web:
      exposure:
        exclude: "*"

  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
  info:
    env:
      enabled: true
endpoints:
  shutdown:
    enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8089/eureka/

info:
  app:
    name: "cards"
    description: "Bank Accounts Application"
    version: "1.0.0"