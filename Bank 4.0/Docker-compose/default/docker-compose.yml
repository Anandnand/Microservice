 services:
    configserver:
      image: "anand5173/configserver:4.0"
      container_name: configserver-ms
      ports:
        - "9090:9090"
      healthcheck:
        test: "curl --fail --silent localhost:9090/actuator/health/readiness | grep UP || exit 1"
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
      extends:
        file: common-config.yml
        service: microservice-base-config

    eurekaserver:
      image: "anand5173/eurekaserver:4.0"
      container_name: eurekaserver-ms
      ports:
        - "8089:8089"
      depends_on:
        configserver:
          condition: service_healthy
      healthcheck:
        test: "curl --fail --silent localhost:8089/actuator/health/readiness | grep UP || exit 1"
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
      extends:
        file: common-config.yml
        service: microservice-configserver-config
      environment:
        SPRING_APPLICATION_NAME: "eurekaserver"



    accounts:
      image: "anand5173/accounts:4.0"
      container_name: accounts-ms
      ports:
        - "8090:8090"
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
      environment:
        SPRING_APPLICATION_NAME: "accounts"
      extends:
        file: common-config.yml
        service: microservice-eureka-config

    cards:
      image: "anand5173/cards:4.0"
      container_name: cards-ms
      ports:
        - "8091:8091"
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
      environment:
        SPRING_APPLICATION_NAME: "cards"
      extends:
        file: common-config.yml
        service: microservice-eureka-config

    loans:
      image: "anand5173/loans:4.0"
      container_name: loans-ms
      ports:
        - "8092:8092"
      depends_on:
        configserver:
          condition: service_healthy
        eurekaserver:
          condition: service_healthy
      environment:
        SPRING_APPLICATION_NAME: "loans"
      extends:
        file: common-config.yml
        service: microservice-eureka-config



 networks:
   bank:
     driver: "bridge"